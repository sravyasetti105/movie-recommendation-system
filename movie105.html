<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream - Recommendation & Download</title>
    
    <!-- CSS STYLES -->
    <style>
        /* CSS Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-color: #e11d48;
            --primary-hover: #be123c;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background-color: rgba(15, 23, 42, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            color: #fff;
            outline: none;
            width: 250px;
            transition: width 0.3s ease;
        }

        .search-box input:focus {
            width: 300px;
            border-color: var(--primary-color);
        }

        /* Genre Filter Section */
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 2rem 0;
            flex-wrap: wrap;
            padding: 0 5%;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #334155;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* Movie Grid */
        .container {
            padding: 0 5% 3rem;
        }

        .section-title {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 2rem;
        }

        /* Movie Card */
        .movie-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .movie-poster {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .movie-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--subtext-color);
            margin-bottom: 1rem;
        }

        .rating {
            color: #f59e0b;
            font-weight: bold;
        }

        .download-btn {
            margin-top: auto;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            text-align: center;
        }

        .download-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--subtext-color);
        }

        .quality-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 1.5rem;
        }

        .quality-btn {
            background: #334155;
            color: white;
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: 0.3s;
        }

        .quality-btn:hover {
            background: var(--primary-color);
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <a href="#" class="logo">CineStream</a>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search movies...">
        </div>
    </header>

    <!-- GENRE RECOMMENDATIONS FILTER -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterGenre('all')">All</button>
        <button class="filter-btn" onclick="filterGenre('Action')">Action</button>
        <button class="filter-btn" onclick="filterGenre('Horror')">Horror</button>
        <button class="filter-btn" onclick="filterGenre('Comedy')">Comedy</button>
        <button class="filter-btn" onclick="filterGenre('Drama')">Drama</button>
    </div>

    <!-- MAIN MOVIES LIST -->
    <main class="container">
        <h2 class="section-title">Recommended Movies</h2>
        <div class="movies-grid" id="moviesGrid">
            <!-- Movie cards injected dynamically via JavaScript -->
        </div>
    </main>

    <!-- DOWNLOAD MODAL -->
    <div class="modal" id="downloadModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalMovieTitle">Download Movie</h3>
            <p style="color: var(--subtext-color); margin-top: 5px;">Select Video Quality</p>
            <div class="quality-options">
                <a href="#" class="quality-btn" onclick="startDownload('720p')">720p (HD) - 800 MB</a>
                <a href="#" class="quality-btn" onclick="startDownload('1080p')">1080p (Full HD) - 1.8 GB</a>
                <a href="#" class="quality-btn" onclick="startDownload('4K')">2160p (4K Ultra HD) - 4.5 GB</a>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Sample Movie Data Array
        const movies = [
            {
                id: 1,
                title: "virupaksha",
                genre: "Horror",
                rating: "8.8",
                year: "2022",
                poster: "https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcSdDZ_5zftRRVtKF9nDNDfeqhPwibah5WVsnduVaR1wVkrHjnLg"
            },
            {
                id: 2,
                title: "Saalar: part 1",
                genre: "Action",
                rating: "9.0",
                year: "2023",
                poster: "https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcRDQcfmvJreqKcTMHYKYM_vtiRqTU-CcuVEnfmlUVyT9hBQstwZ"
            },
            {
                id: 3,
                title: "kanchana",
                genre: "Horror",
                rating: "8.6",
                year: "2011",
                poster: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ-bMC3Ho1S9stPzswXRRe2QcOtXxTv3r04KNjNIWxGFxCOocuc"
            },
            {
                id: 4,
                title: "MAD",
                genre: "Comedy",
                rating: "7.7",
                year: "2023",
                poster: "https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcSXleni3JYlZiLLOL4Tlk4s_9gPAKcelveNs1z3jbnW2ZdMNLXx"
            },
            {
                id: 5,
                title: "Mahanati",
                genre: "Drama",
                rating: "8.9",
                year: "2018",
                poster: "https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcSqNnrBhx3Nc2sQxLoF3iD7bLC7ij8w0WystEq0TNG0SM61ozT5"
            },
            {
                id: 6,
                title: "Avatar",
                genre: "Action",
                rating: "7.9",
                year: "2009",
                poster: "https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcSYWVMx6h59vKIGkku5l3hPkBbqsErDsCB7-QZ9zaKuhTN8edvL"
            }  
        ];

        const moviesGrid = document.getElementById('moviesGrid');
        const searchInput = document.getElementById('searchInput');
        const downloadModal = document.getElementById('downloadModal');
        const modalMovieTitle = document.getElementById('modalMovieTitle');

        // Render movies dynamically
        function displayMovies(movieList) {
            moviesGrid.innerHTML = "";
            
            if (movieList.length === 0) {
                moviesGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--subtext-color);">No movies found.</p>`;
                return;
            }

            movieList.forEach(movie => {
                const card = document.createElement('div');
                card.classList.add('movie-card');
                card.innerHTML = `
                    <img src="${movie.poster}" alt="${movie.title}" class="movie-poster">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${movie.year} • ${movie.genre}</span>
                            <span class="rating">★ ${movie.rating}</span>
                        </div>
                        <button class="download-btn" onclick="openDownloadModal('${movie.title}')">Download</button>
                    </div>
                `;
                moviesGrid.appendChild(card);
            });
        }

        // Filter Movies by Genre
        function filterGenre(genre) {
            // Update active state on buttons
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (genre === 'all') {
                displayMovies(movies);
            } else {
                const filtered = movies.filter(movie => movie.genre === genre);
                displayMovies(filtered);
            }
        }

        // Live Search Handler
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredMovies = movies.filter(movie => 
                movie.title.toLowerCase().includes(searchTerm) || 
                movie.genre.toLowerCase().includes(searchTerm)
            );
            displayMovies(filteredMovies);
        });

        // Download Modal Functions
        function openDownloadModal(title) {
            modalMovieTitle.innerText = `Download: ${title}`;
            downloadModal.style.display = 'flex';
        }

        function closeModal() {
            downloadModal.style.display = 'none';
        }

        function startDownload(quality) {
            alert(`Your download for ${modalMovieTitle.innerText} (${quality}) has started!`);
            closeModal();
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            if (event.target === downloadModal) {
                closeModal();
            }
        };

        // Initial Load
        displayMovies(movies);
    </script>
</body>
</html>
